<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>People | RAIN Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Urbanist:wght@500;600;700&display=swap"><style>:root{
  --cloud:#f6f8fb; --white:#ffffff; --ink:#13101d; --muted:#586174; --line:#e1e6ee;
  --blue:#1f6feb; --blue-text:#1a5fcc; --blue-soft:#e7effd;
  --night:#0b0714; --black:#000; --night-ink:#eef1f7; --night-muted:#9aa3b6; --night-line:#231d33;
  --f-display:"Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cloud);color:var(--ink);font:400 1rem/1.6 var(--f-body)}
img{max-width:100%;height:auto}
a{color:var(--blue-text);text-underline-offset:.18em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:72rem;margin-inline:auto;padding-inline:max(16px,4vw)}
.mono{font-family:var(--f-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:block;height:1.6rem;width:auto;overflow:visible}
.logo-flame{fill:#1f6feb}
/* concept switcher (demo only) */
.cbar{background:#1a1625;color:#cfd5e2;font:500 .78rem var(--f-mono);border-bottom:1px solid #2c2540}
.cbar .wrap{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;align-items:center;padding-block:.45rem}
.cbar a{color:#cfd5e2;text-decoration:none;opacity:.7}
.cbar a[aria-current]{opacity:1;color:#fff;text-decoration:underline;text-underline-offset:.3em}
.cbar span{opacity:.5;margin-right:.4rem}
/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);border-bottom:1px solid #1b1726;color:#fff}
.mast .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem 2rem;padding-block:.85rem}
.mast nav{display:flex;flex-wrap:wrap;gap:.2rem 1.5rem}
.mast nav a{color:#aeb6c7;text-decoration:none;font-weight:500;font-size:.95rem}
.mast nav a:hover{color:#fff}
.mast .brand{color:#fff}
/* approved hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:#000;color:#fff;min-height:clamp(22rem,36vw,32rem);display:grid;align-items:center;padding-block:clamp(3rem,6vw,5rem)}
.hero .hz{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero .hz::before{content:"";position:absolute;top:50%;right:50%;width:3000px;height:3000px;margin-top:-1500px;border-radius:50%;background:#000;
  box-shadow:1px 0 0 0 rgba(205,218,255,.8),3px 0 12px 1px rgba(120,165,255,.35),12px 0 90px 12px rgba(31,111,235,.16)}
.hero .hz::after{content:"";position:absolute;left:0;right:0;top:57%;height:240px;margin-top:-120px;
  background:radial-gradient(closest-side,rgba(225,236,255,.5),rgba(110,155,255,.16) 40%,transparent 72%) 50.5% 50%/220px 240px no-repeat,
  linear-gradient(90deg,transparent 18%,rgba(120,165,255,.28) 50%,transparent 82%) 0 50%/100% 2px no-repeat}
.hero .in{display:grid;justify-items:center;text-align:center;gap:clamp(.8rem,1.6vw,1.4rem)}
.hero .logo{height:clamp(2.8rem,1.2rem + 6vw,6.2rem)}
.hero .sub{font-family:var(--f-display);font-weight:500;font-size:clamp(1rem,.7rem + 1.3vw,1.75rem);color:#d4d8e2}
.hero .rule{width:clamp(6rem,12vw,9rem);height:3px;border-radius:2px;background:var(--blue);opacity:.8;margin-block:clamp(.4rem,1vw,.9rem)}
.hero .uw{font-weight:500;font-size:clamp(1rem,.8rem + .8vw,1.5rem);color:#3d82f0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mast nav a[aria-current]{color:#fff}</style><style>
/* People: a black header slice of orbit with the grid, then the same faded graph paper as the home page's ground. */
.head{position:relative;isolation:isolate;overflow:hidden;background:#000;color:#fff;padding-block:clamp(5rem,9vw,8rem) clamp(4rem,7vw,6rem)}
.grid-bg::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(rgba(61,130,240,.07) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(61,130,240,.07) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(rgba(61,130,240,.12) 1px,transparent 1px) 0 0/120px 120px,
    linear-gradient(90deg,rgba(61,130,240,.12) 1px,transparent 1px) 0 0/120px 120px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 14%,rgba(0,0,0,.18) 26%,rgba(0,0,0,.18) 72%,#000 88%);
          mask-image:linear-gradient(90deg,#000 0,#000 14%,rgba(0,0,0,.18) 26%,rgba(0,0,0,.18) 72%,#000 88%)}
.head h1{font-size:clamp(2.4rem,1.6rem + 3vw,3.8rem);font-weight:700;letter-spacing:-.01em}
.body{position:relative;isolation:isolate;background:var(--cloud)}
.hand{font-family:"Caveat","Segoe Print",cursive;font-weight:600}
.sec{padding-block:clamp(5rem,9vw,8rem) 0}
.sec:last-child{padding-bottom:clamp(5rem,9vw,8rem)}
.sec h2{font-size:clamp(2rem,1.4rem + 2.4vw,3.2rem);font-weight:700;letter-spacing:-.01em}
.inner{max-width:58rem}

.photo{aspect-ratio:16/6;max-width:100%;border:1.5px dashed rgba(26,95,204,.35);border-radius:10px;display:grid;place-content:center;color:var(--muted);background:rgba(255,255,255,.55)}

.pi{display:grid;grid-template-columns:12rem minmax(0,1fr);gap:2.5rem;align-items:start;margin-top:2.8rem}
.pi img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.pi h3{font:600 1.5rem/1.2 var(--f-display)}
.pi .t{font-weight:500;margin-top:.4rem}
.pi .x{color:var(--muted);font-size:.92rem}
.pi .b{color:#3e4657;margin-top:1rem;max-width:40rem}
.pi .l{margin-top:1rem;font-size:.95rem}

.crew{list-style:none;margin:2.8rem 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4rem 2rem}
.crew li{display:grid;gap:.9rem;align-content:start}
.av{display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;background:#e9eef6;color:#8a95ab;border:1px solid var(--line);font:500 1.6rem var(--f-mono);letter-spacing:.06em}
img.av{border:0;background:#000}
.crew h3{font:600 1.15rem/1.3 var(--f-display)}
.crew h3 a{color:var(--ink);text-decoration:none}
.crew h3 a:hover{color:var(--blue-text);text-decoration:underline}
.crew p{font-size:.9rem;color:var(--muted);margin-top:.25rem}

.alum{margin-top:2.8rem;display:grid;gap:2.6rem}
.alum h3{font:500 .78rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:.6rem 1rem .6rem 0;border-top:1px solid var(--line);vertical-align:baseline}
tr:last-child td{border-bottom:1px solid var(--line)}
td.n{white-space:nowrap;font-weight:500}
td.n a{color:var(--ink);text-decoration:none}
td.n a:hover{color:var(--blue-text);text-decoration:underline}
td.y{font:500 .82rem var(--f-mono);color:var(--muted);width:4.5rem;text-align:right;padding-right:1.6rem;font-variant-numeric:tabular-nums}
td.w{color:var(--muted)}
.foot{background:#000;color:#6f7a92;padding-block:2.5rem;font-size:.85rem}
@media (max-width:760px){.pi{grid-template-columns:minmax(0,1fr)}.pi img{max-width:12rem}.crew{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8rem 1rem}.photo{aspect-ratio:4/3}}

127525011918}\n}"},{"t":"Onboard Dual Quaternion Guidance for Rocket Landing","a":["Abhinav G. Kamath","Javier A. Doll","Purnanand Elango","Taewan Kim","Skye Mceowen","Yue Yu","Taylor P. Reynolds","Gavin F. Mendeck","John M. Carson III","Mehran Mesbahi","Behçet Açıkmeşe"],"v":"arXiv","y":2025,"k":"Journal","l":[],"ar":["guidance"],"aw":null,"b":"@article{Kamath2025-onboard,\n  title = {Onboard Dual Quaternion Guidance for Rocket Landing},\n  author = {Kamath, Abhinav G. and Doll, Javier A. and Elango, Purnanand and Kim, Taewan and Mceowen, Skye and Yu, Yue and Reynolds, Taylor P. and Mendeck, Gavin F. and Carson III, John M. and Mesbahi, Mehran and A{\\c{c}}{\\i}kme{\\c{s}}e, Beh{\\c{c}}et},\n  journal = {arXiv},\n  month = {8},\n  year = {2025},\n  arxiv = {2508.10439}\n}"},{"t":"Centralized and Distributed Strategies for Handover-Aware Task Allocation in Satellite Constellations","a":["Joshua Holder","Spencer Kraisler","Mehran Mesbahi"],"v":"Journal of Guidance, Control, and Dynamics","y":2025,"k":"Journal","l":[["DOI","https://doi.org/10.2514/1.G008363"]],"ar":["networks","debris"],"aw":null,"b":"@article{Holder2025-handover,\n  title = {Centralized and Distributed Strategies for Handover-Aware Task Allocation in Satellite Constellations},\n  author = {Holder, Joshua and Kraisler, Spencer and Mesbahi, Mehran},\n  journal = {Journal of Guidance, Control, and Dynamics},\n  volume = {48},\n  number = {6},\n  pages = {1201--1210},\n  month = {6},\n  year = {2025},\n  doi = {10.2514/1.G008363}\n}"},{"t":"Privacy-preserving average consensus via matrix-weighted inter-agent coupling","a":["Lulu Pan","Haibin Shao","Yang Lu","Mehran Mesbahi","Dewei Li","Yugeng Xi"],"v":"Automatica","y":2025,"k":"Journal","l":[],"ar":["networks"],"aw":null,"b":"@ARTICLE{Pan2025-es,\n  title     = \"Privacy-preserving average consensus via matrix-weighted\n  inter-agent coupling\",\n  author    = \"Pan, Lulu and Shao, Haibin and Lu, Yang and Mesbahi, Mehran and\n  Li, Dewei and Xi, Yugeng\",\n  journal   = \"Automatica\",\n  publisher = \"Elsevier BV\",\n  volume    =  174,\n  number    =  112094,\n  pages     =  112094,\n  month     =  apr,\n  year      =  2025,\n  language  = \"en\"\n}"},{"t":"Multi Agent Reinforcement Learning for Sequential Satellite Assignment Problems","a":["Joshua Holder","Natasha Jaques","Mehran Mesbahi"],"v":"AAAI Conference on Artificial Intelligence","y":2025,"k":"Journal","l":[],"ar":["learning","debris"],"aw":null,"b":"@ARTICLE{Holder2024-vg,\n  title         = \"Multi Agent Reinforcement Learning for Sequential Satellite Assignment Problems\",\n  author        = \"Holder, Joshua and Jaques, Natasha and Mesbahi, Mehran\",\n  journal       = \"AAAI Conference on Artificial Intelligence\",\n  month         =  \"March\",\n  year          =  2025,\n  abstract = {Assignment problems are a classic combinatorial optimization\nproblem in which a group of agents must be assigned to\na group of tasks such that maximum utility is achieved while\nsatisfying assignment constraints. Given the utility of each\nagent completing each task, polynomial-time algorithms exist\nto solve a single assignment problem in its simplest form.\nHowever, in many modern-day applications such as satellite\nconstellations, power grids, and mobile robot scheduling,\nassignment problems unfold over time, with the utility\nfor a given assignment depending heavily on the state of the\nsystem. We apply multi-agent reinforcement learning to this\nproblem, learning the value of assignments by bootstrapping\nfrom a known polynomial-time greedy solver and then learning\nfrom further experience. We then choose assignments using\na distributed optimal assignment mechanism rather than\nby selecting them directly. We demonstrate that this algorithm\nis theoretically justified and avoids pitfalls experienced\nby other RL algorithms in this setting. Finally, we show that\nour algorithm significantly outperforms other methods in the\nliterature, even while scaling to realistic scenarios with hundreds\nof agents and tasks.},\n}"},{"t":"Improving Kinetic Consistency Across Elastic Model Transitions With Quadratic Inequality Constrained Weighted Least Squares (WLSQI)","a":["Justin Ganiban","Wei Wu"],"v":"AAS/AIAA Space Flight Mechanics Meeting","y":2025,"k":"Conference","l":[["Link","https://ntrs.nasa.gov/citations/20240016198"]],"ar":[],"aw":null,"b":"@inproceedings{Ganiban2025-wlsqi,\n  title = {Improving Kinetic Consistency Across Elastic Model Transitions With Quadratic Inequality Constrained Weighted Least Squares ({WLSQI})},\n  author = {Ganiban, Justin and Wu, Wei},\n  booktitle = {AAS/AIAA Space Flight Mechanics Meeting},\n  note = {AAS 25-133},\n  month = {1},\n  year = {2025},\n  url = {https://ntrs.nasa.gov/citations/20240016198}\n}"},{"t":"Intrinsic Successive Convexification: Trajectory Optimization on Smooth Manifolds","a":["Spencer Kraisler","Mehran Mesbahi","Behçet Açikmeşe"],"v":"IEEE Control Systems Letters","y":2025,"k":"Journal","l":[["DOI","https://doi.org/10.1109/LCSYS.2025.3571671"]],"ar":["guidance"],"aw":null,"b":"@ARTICLE{11007149,\n  author={Kraisler, Spencer and Mesbahi, Mehran and Açikmeşe, Behçet},\n  journal={IEEE Control Systems Letters}, \n  title={Intrinsic Successive Convexification:Trajectory Optimization on Smooth Manifolds}, \n  year={2025},\n  volume={},\n  number={},\n  pages={1-1},\n  keywords={Manifolds;Quaternions;Vectors;Trajectory optimization;Vehicle dynamics;Measurement;Heuristic algorithms;Costs;Aerospace electronics;Aerodynamics;Trajectory optimization;intrinsic convex optimization;optimization over Riemannian manifolds},\n  doi={10.1109/LCSYS.2025.3571671}}"},{"t":"Dynamic Modeling of Origami Reconfigurations via Triangulated Consensus","a":["Yuto Tanaka","Ran Dai","Mehran Mesbahi"],"v":"American Control Conference (ACC)","y":2025,"k":"Conference","l":[["DOI","https://doi.org/10.23919/ACC63710.2025.11108104"]],"ar":["networks"],"aw":null,"b":"@inproceedings{DBLP_conf_amcc_TanakaDM25  Optimization in Control: Geometry and Algorithmic Implications}, \n  author={Shahriar Talebi and Yang Zheng and Spencer Kraisler and Na Li and Mehran Mesbahi},\n  year={2024},\n  eprint={2406.04243},\n  archivePrefix={arXiv},\n  primaryClass={math.OC},\n  arxiv = {2406.04243},\n}"},{"t":"Extended Abstract for Collaborative Mission Autonomy for Resilient Highly Integrated Networked Operations (CMA-RHINO)","a":["Michael J. Park","Dylan Markovic","Mehran Mesbahi","Sean Phillips"],"v":"AIAA SCITECH 2024 Forum","y":2024,"k":"Chapter","l":[["DOI","https://doi.org/10.2514/6.2024-2416"]],"ar":["networks"],"aw":null,"b":"@inbook{doi:10.2514/6.2024-2416,\nauthor = {Michael J. Park and Dylan Markovic and Mehran Mesbahi and Sean Phillips},\ntitle = {Extended Abstract for Collaborative Mission Autonomy for Resilient Highly Integrated Networked Operations (CMA-RHINO)},\nbooktitle = {AIAA SCITECH 2024 Forum},\nchapter = {},\npages = {},\ndoi = {10.2514/6.2024-2416},\nURL = {https://arc.aiaa.org/doi/abs/10.2514/6.2024-2416},\neprint = {https://arc.aiaa.org/doi/pdf/10.2514/6.2024-2416},\n  abstract = { The standard process for determining and disseminating tasking for surveillance satellite systems can be a slow and lengthy procedure, especially when faced with occasionally intermittent connections between ground-to-satellite and intersatellite communications. For specific applications with dynamic real-time surveillance requirements, such as defense missions with unpredictable adversaries, real-time satellite tasking would be a critical enabler. The purpose of SSCI’s Collaborative Mission Autonomy for Resilient Highly Integrated Network Operations (CMA-RHINO) effort is to study algorithms that can manage and adjust the satellite network autonomously in real-time, with resilience to disruptions that may occur in real-world scenarios. CMA-RHINO analyzes a selected sample of heuristic and auction-based algorithms; posits a decentralized heuristic-supported algorithm to improve satellite network tasking and reduce the need for ground control intervention; and implements this approach in simulation and benchtop hardware, with promising results. }\n}"},{"t":"Data-Guided Regulator for Adaptive Nonlinear Control","a":["Niyousha Rahimi","Mehran Mesbahi"],"v":"AIAA SCITECH 2024 Forum","y":2024,"k":"Chapter","l":[["DOI","https://doi.org/10.2514/6.2024-0090"]],"ar":["learning"],"aw":null,"b":"@inbook{doi:10.2514/6.2024-0090,\nauthor = {Niyousha Rahimi and Mehran Mesbahi},\ntitle = {Data-Guided Regulator for Adaptive Nonlinear Control},\nbooktitle = {AIAA SCITECH 2024 Forum},\nchapter = {},\npages = {},\ndoi = {10.2514/6.2024-0090},\nURL = {https://arc.aiaa.org/doi/abs/10.2514/6.2024-0090},\neprint = {https://arc.aiaa.org/doi/pdf/10.2514/6.2024-0090},\n  abstract = { This paper addresses the problem of designing a data-driven feedback controller for complex nonlinear dynamical systems in the presence of time-varying disturbances with unknown dynamics. Such disturbances are modeled as the “unknown” part of the system dynamics. The goal is to achieve finite-time regulation of system states through direct policy updates while also generating informative data that can subsequently be used for data-driven stabilization or system identification. First, we expand upon the notion of “regularizability” and characterize this system characteristic for a linear time-varying representation of the nonlinear system with locally-bounded higher-order terms. “Rapid-regularizability” then gauges the extent by which a system can be regulated in finite time, in contrast to its asymptotic behavior. We then propose the Data-Guided Regulation for Adaptive Nonlinear Control (DG-RAN) algorithm, an online iterative synthesis procedure that utilizes discrete time-series data from a single trajectory for regulating system states and identifying disturbance dynamics. The effectiveness of our approach is demonstrated on a 6-DOF power descent guidance problem in the presence of adverse environmental disturbances. },\n}"},{"t":"MPC-based Estimation-Aware Trajectory Generation for Uncontrolled Satellite Pose Tracking","a":["Aditya Deole","Beniamino Pozzan","Mehran Mesbahi"],"v":"AIAA SCITECH 2024 Forum","y":2024,"k":"Chapter","l":[["DOI","https://doi.org/10.2514/6.2024-0947"]],"ar":["guidance","navigation","debris"],"aw":null,"b":"@inbook{doi:10.2514/6.2024-0947,\nauthor = {Aditya Deole and Beniamino Pozzan and Mehran Mesbahi},\ntitle = {MPC-based Estimation-Aware Trajectory Generation for Uncontrolled Satellite Pose Tracking},\nbooktitle = {AIAA SCITECH 2024 Forum},\nchapter = {},\npages = {},\ndoi = {10.2514/6.2024-0947},\nURL = {https://arc.aiaa.org/doi/abs/10.2514/6.2024-0947},\neprint = {https://arc.aiaa.org/doi/pdf/10.2514/6.2024-0947},\n  abstract = { We show that observability based measures can effectively be used for evaluating trajectories that facilitate improved state estimation under uncertain measurements in the space environment. In this direction, we examine the problem of tracking an uncontrolled/uncooperative Target satellite by an Ego spacecraft using output measurements from a Machine Learning (ML) based pose estimator. We then represent state dependent uncertainties to model the output measured from the nonlinear perception map. Using an estimate of the current satellite state, we then proceed to propose a Model Predictive Controller (MPC) based design for generating desirable and informative trajectories for the Ego spacecraft. The MPC optimizes a trajectory that performs a tracking task while improving state estimation for auxiliary purposes. We use observability measures on the perception map to justify that the selected trajectory improves Target tracking. },\n}"},{"t":"Policy Optimization Over Submanifolds for Linearly Constrained Feedback Synthesis","a":["Shahriar Talebi","Mehran Mesbahi"],"v":"IEEE Transactions on Automatic Control","y":2024,"k":"Journal","l":[["DOI","https://doi.org/10.1109/TAC.2023.3306384"]],"ar":["l <script>
(function(){
  var D=DATA, esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var pi=D.pi;
  document.getElementById("pi-n").textContent=pi.name;
  document.getElementById("pi-t").textContent=pi.title;
  document.getElementById("pi-x").textContent=pi.extra;
  document.getElementById("pi-b").textContent=pi.bio;
  document.getElementById("pi-l").href=pi.url;
  function ini(n){return n.split(" ").map(function(w){return w[0]}).slice(0,2).join("")}
  var arrow='<svg viewBox="0 0 34 16" aria-hidden="true"><path d="M2 9c8-4 18-5 28-1M24 3l7 5-7 5"/></svg>';
  document.getElementById("crew").innerHTML=D.members.filter(function(m){return m.role==="phd"}).map(function(m){
    var nm=m.url?'<a href="'+esc(m.url)+'">'+esc(m.name)+'</a>':esc(m.name);
    var av=m.photo?'<img class="av" src="'+esc(m.photo.split("/").pop())+'" alt="'+esc(m.name)+'" width="300" height="300">':'<span class="av" aria-hidden="true">'+ini(m.name)+'</span>';
    return '<li>'+av+'<div><h3>'+nm+'</h3>'+(m.topic?'<p>'+esc(m.topic)+'</p>':'')+'</div></li>';
  }).join("");
  var groups=[["phd","Ph.D."],["ms","M.S."],["postdoc","Postdoctoral fellows"],["visiting","Visiting Ph.D. students"]];
  document.getElementById("alum").innerHTML=groups.map(function(g){
    var rows=D.allAlumni.filter(function(a){return a.degree===g[0]});
    if(!rows.length)return "";
    return '<div><h3>'+g[1]+'</h3><div class="tbl"><table><tbody>'+rows.map(function(a){
      var nm=a.url?'<a href="'+esc(a.url)+'">'+esc(a.name)+'</a>':esc(a.name);
      return '<tr><td class="n">'+nm+'</td><td class="y">'+esc(a.year)+'</td><td class="w">'+esc(a.now)+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';
  }).join("");
})();
</script>
